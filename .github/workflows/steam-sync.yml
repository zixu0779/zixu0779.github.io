name: Sync Steam
on:
  schedule:
    # Monday 08:17 Asia/Shanghai; GitHub may delay scheduled runs.
    - cron: '17 0 * * 1'
  workflow_dispatch:
permissions:
  contents: write
  pages: write
concurrency:
  group: steam-sync
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: source
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install existing EJS renderer only
        run: |
          npm install --prefix "$RUNNER_TEMP/steam-renderer" --ignore-scripts --no-audit --no-fund hexo-renderer-ejs@2.0.0
          echo "NODE_PATH=$RUNNER_TEMP/steam-renderer/node_modules" >> "$GITHUB_ENV"
      - run: node tests/steam-sync.test.js && node tests/steam-family.test.js
      - run: npm ci --prefix lib/steam-auth --ignore-scripts --no-audit --no-fund
      - run: node tests/steam-auth.test.js && node tests/steam-collections.test.js && node tests/steam-client.test.js
      - name: Renew Steam login
        env:
          STEAM_TOKEN_KEY: ${{ secrets.STEAM_TOKEN_KEY }}
        run: node lib/steam-auth/refresh.cjs
      - name: Preserve encrypted credential recovery copy
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: steam-encrypted-session
          path: .github/steam-session.enc.json
          include-hidden-files: true
          retention-days: 30
      - name: Persist renewed credential before collecting data
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/steam-session.enc.json
          if ! git diff --cached --quiet; then
            git commit -m 'chore: renew encrypted Steam session'
            for attempt in 1 2 3; do
              git push origin HEAD:source && break
              [ "$attempt" -lt 3 ] || exit 1
              sleep 5
            done
          fi
      - name: Collect public Steam data
        env:
          STEAM_API_KEY: ${{ secrets.STEAM_API_KEY }}
        run: node lib/steam-sync.cjs
      - uses: actions/upload-artifact@v4
        with:
          name: steam-snapshot
          path: |
            source/_data/steam.json
            source/_data/steam-display.json
            source/images/steam/
          retention-days: 3
      - uses: actions/checkout@v4
        with:
          ref: main
          path: _published
      - name: Update Steam fragments only
        run: node lib/steam-publish.cjs _published
      - name: Save snapshot and publish
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add source/_data/steam.json source/_data/steam-display.json source/images/steam
          if ! git diff --cached --quiet; then
            git commit -m 'data: sync Steam snapshot'
            for attempt in 1 2 3; do
              git push origin HEAD:source && break
              [ "$attempt" -lt 3 ] || exit 1
              sleep 5
            done
          fi
          cd _published
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add about/index.html steam/index.html data/steam.json images/steam css/steam.css js/site-ui.js ":(glob)**/*.html"
          if ! git diff --cached --quiet; then
            git commit -m 'deploy: update Steam activity'
            for attempt in 1 2 3; do
              git push origin HEAD:main && break
              [ "$attempt" -lt 3 ] || exit 1
              sleep 5
            done
          fi
      - name: Request GitHub Pages build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for attempt in 1 2 3; do
            if gh api --method POST "repos/$GITHUB_REPOSITORY/pages/builds"; then
              exit 0
            fi
            sleep 5
          done
          exit 1
